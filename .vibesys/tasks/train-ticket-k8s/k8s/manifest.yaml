# The train-ticket-k8s topology: the six Train Ticket services the workload exercises, each
# with its own MongoDB, behind the task's gateway. The task owns this file; the candidate owns
# the image every service runs (${TRAIN_TICKET_IMAGE}, built from the repository root's
# Dockerfile), which must start each service with `command: [<service>]`.
#
# Resources are fixed (requests = limits): each service 2 CPUs and 1 GiB, each MongoDB 1 CPU
# and 1 GiB, the gateway 2 CPUs and 256 MiB. ${NAMESPACE} is the sample's fresh namespace.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ts-gateway-config
data:
  nginx.conf: |
    # The gateway: the services' public paths, as Train Ticket's own UI proxy routes them
    # (ts-ui-dashboard/nginx.conf), with keep-alive connections to every service.
    worker_processes 2;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events {
      worker_connections 8192;
    }
    http {
      access_log off;
      keepalive_requests 1000000;
      keepalive_timeout 120s;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_buffering on;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      upstream config {
        server ts-config-service:15679;
        keepalive 256;
      }
      upstream station {
        server ts-station-service:12345;
        keepalive 256;
      }
      upstream train {
        server ts-train-service:14567;
        keepalive 256;
      }
      upstream travel {
        server ts-travel-service:12346;
        keepalive 256;
      }
      upstream route {
        server ts-route-service:11178;
        keepalive 256;
      }
      upstream price {
        server ts-price-service:16579;
        keepalive 256;
      }
      server {
        listen 8080 reuseport backlog=4096;
        location = /healthz {
          return 200 "ok\n";
        }
        location /api/v1/configservice {
          proxy_pass http://config;
        }
        location /api/v1/stationservice {
          proxy_pass http://station;
        }
        location /api/v1/trainservice {
          proxy_pass http://train;
        }
        location /api/v1/travelservice {
          proxy_pass http://travel;
        }
        location /api/v1/routeservice {
          proxy_pass http://route;
        }
        location /api/v1/priceservice {
          proxy_pass http://price;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-gateway
  labels:
    app: ts-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ts-gateway
  template:
    metadata:
      labels:
        app: ts-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: "2", memory: 256Mi}
          limits: {cpu: "2", memory: 256Mi}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 2
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: ts-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: ts-gateway
spec:
  selector:
    app: ts-gateway
  ports:
  - port: 8080
    targetPort: 8080
---
