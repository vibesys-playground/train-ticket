    tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ts-config-mongo
  template:
    metadata:
      labels:
        app: ts-config-mongo
        tier: data
    spec:
      containers:
      - name: mongo
        image: mongo:3.4@sha256:d314f7eca9d3f825d091b77c40d2f3c9d6fff4de88dde2962527353476f107ba
        ports:
        - containerPort: 27017
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "1", memory: 1Gi}
        readinessProbe:
          tcpSocket: {port: 27017}
          periodSeconds: 2
---
apiVersion: v1
