version = "0.2"

[agent]
domain = "microservices"

[environment]
needs = ["kubernetes"]

# Both commands run the trusted task code baked into the task image at /task; they read
# KUBECONFIG, VIBESYS_K8S_REGISTRY and VIBESYS_K8S_BUILDER from the environment and build the
# candidate's image (the repository root's Dockerfile) in the cluster's builder. The task
# deploys and tears down the application itself (vibesys_evaluator.microservices.k8s.App), so
# it has no [candidate] server.
#
# Both are bench.py. The accuracy check is vibesys-evaluator's accuracy run (four open-loop
# phases at 40 operations per second with every service restarted once between them, the
# history captured), judged by the task's oracle (tt-oracle); exit 0 PASS, 1 FAIL, 2 UNKNOWN.
# The benchmark is one sample per run. README.md has both.
[accuracy]
command = ["python", "/task/bench.py", "accuracy", "--project-root", "${PROJECT_ROOT}"]
timeout_seconds = 2400

[benchmark]
command = ["python", "/task/bench.py", "benchmark", "--project-root", "${PROJECT_ROOT}"]
timeout_seconds = 3600
result_protocol = 2
